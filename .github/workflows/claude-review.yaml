# Claude reviews a pull request when asked: comment `@claude review` on the
# pull request, or add the `claude-review` label. The review is advisory and
# is not a required check. The procedure is .claude/commands/review-pr.md and
# the rules it checks against are .claude/CLAUDE.md.
#
# Runs on the maintainer's Claude subscription (secret
# CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`) through the Claude
# GitHub App, which must be installed on the repository.
#
# Security:
# - Only a comment from someone with write access starts a review (checked in
#   the job condition and again inside the action); the label path is limited
#   to branches of this repository, since fork runs get no secrets.
# - The default branch is checked out at the workspace root, so the
#   instructions Claude reads come from develop. The pull request's files are
#   checked out without credentials into pr-head/, and any CLAUDE.md or
#   .claude/ they carry is removed before Claude starts: those are material
#   under review, not instructions. (The action also restores .claude/ and
#   CLAUDE.md at the root from the base branch on its own.)
# - The action declines to run, and exits successfully, when this file on the
#   pull request differs from the default branch's copy. The last step fails
#   the job whenever no review summary was posted for the reviewed commit.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

name: claude-review.yaml

permissions: {}

jobs:
  claude-review:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@claude review')
        && github.event.comment.user.type == 'User'
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request'
        && github.event.label.name == 'claude-review'
        && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # At job level, so the runs started by every other comment on the pull
    # request (including Claude's own) are skipped by the condition above
    # without cancelling or displacing a review that is queued or running.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Check out the pull request into pr-head/
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      - name: Remove instruction files carried by the pull request
        run: |
          rm -rf pr-head/.claude pr-head/.mcp.json pr-head/.claude.json
          find pr-head -type f \( -name CLAUDE.md -o -name CLAUDE.local.md \) -print -delete

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /review-pr ${{ github.repository }} ${{ env.PR_NUMBER }} --comment
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --add-dir pr-head
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action reports success whenever Claude exits cleanly, including
      # when it declined to run or ended without posting (a refused command is
      # not an error). The summary comment for the reviewed commit is the only
      # evidence that a review happened, so its absence fails the job.
      - name: Fail when no summary was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git -C pr-head rev-parse --short=7 HEAD)
          found=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments \
            --jq "[.comments[] | select(.body | contains(\"rtprep-claude-review\") and contains(\"$sha\"))] | length")
          if [ "$found" -eq 0 ]; then
            echo "::error title=no review posted::No Claude review summary for commit $sha on #$PR_NUMBER. If this pull request changes .github/workflows/claude-review.yaml the action declines to run by design; otherwise read the log of the Review step."
            exit 1
          fi
          echo "ok: review summary for $sha posted"
