# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The documentation carries package behaviour, not the manuscript's
      # findings; the gate fails the build on the sources here and on the
      # built pages after the build.
      - name: Gate the sources against manuscript coupling
        run: Rscript .github/docs-decoupling-gate.R
        shell: bash

      - name: Build site
        run: |
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

          # DESIGN.md is the compendium's design record, not package
          # documentation. pkgdown renders every root-level .md it does not
          # recognise, so whenever the file is present in the checkout its
          # page and its index entries are removed here. Idempotent when the
          # file is absent. The destination is docs/ for a release version and
          # docs/dev/ under development mode.
          site <- pkgdown::as_pkgdown(".", override = list(destination = "docs"))$dst_path
          unlink(file.path(site, c("DESIGN.html", "DESIGN.md")))
          sitemap <- file.path(site, "sitemap.xml")
          if (file.exists(sitemap)) {
            lines <- readLines(sitemap, warn = FALSE)
            writeLines(lines[!grepl("/DESIGN.html</loc>", lines, fixed = TRUE)], sitemap)
          }
          search <- file.path(site, "search.json")
          if (file.exists(search)) {
            index <- jsonlite::read_json(search)
            is_design <- vapply(index, function(record) {
              p <- record$path
              is.character(p) && length(p) == 1 && endsWith(p, "/DESIGN.html")
            }, logical(1))
            jsonlite::write_json(
              index[!is_design], search,
              auto_unbox = TRUE, null = "null", na = "null"
            )
          }
          llms <- file.path(site, "llms.txt")
          if (file.exists(llms)) {
            lines <- readLines(llms, warn = FALSE)
            writeLines(lines[!grepl("/DESIGN.md)", lines, fixed = TRUE)], llms)
          }
        shell: Rscript {0}

      - name: Gate the built site against manuscript coupling
        run: Rscript .github/docs-decoupling-gate.R
        shell: bash

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # clean: true so a page that stops being built stops being served.
          # Under the previous `clean: false` the action only added and
          # overwrote, so DESIGN.html and the simulation article kept being
          # served from gh-pages long after they were removed from the source.
          # No CNAME lives on this branch -- the custom domain is configured on
          # the user site, not per project -- so nothing here needs excluding.
          clean: true
          branch: gh-pages
          folder: docs
