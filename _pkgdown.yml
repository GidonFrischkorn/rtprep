url: https://www.gfrischkorn.org/rtprep/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#0072B2" # Okabe-Ito blue

development:
  mode: auto

navbar:
  structure:
    left: [intro, reference, articles, news] # `news` is the NEWS.md component
    right: [search, github]

reference:
  - title: About rtprep
    contents:
      - rtprep-package
      - rtprep-glossary
  - title: Screening
    desc: One engine, one return shape, whichever rule is applied.
    contents:
      - rt_screen
      - rt_keep
      - screen_fits
      - rules
      - rtprep_screen
  - title: Combining rules
    desc: >
      No single conventional rule reaches both the slow tail and the leading
      edge; these put two together.
    contents:
      - rules_compose
      - rule_hierarchical
  - title: Aggregation and estimation
    desc: From surviving trials to EZ-diffusion inputs and parameters.
    contents:
      - rt_summary
      - adjust_accuracy
      - ez_ddm
  - title: Comparison and diagnostics
    desc: >
      What a different choice would have removed, and whether the removed
      trials were what you thought.
    contents:
      - screen_compare
      - check_guessing
  - title: Ground truth
    desc: >
      Generate data whose contaminants are labelled, and remove exactly those,
      so a screen can be scored and read against perfect exclusion.
    contents:
      - r_contaminated
      - rule_oracle
  - title: Extending rtprep
    desc: Adding a screening rule from your own package.
    contents:
      - extending
  - title: Data
    contents:
      - has_keyword("datasets")

# The get-started vignette (rtprep.Rmd) is not listed here: pkgdown puts it in
# the navbar's `intro` slot, and listing it as an article as well left the
# dropdown with a heading and no links. Sections grow as articles land; an
# article file that is not listed fails `pkgdown::check_pkgdown()`.
articles:
  - title: Using rtprep
    navbar: Using rtprep
    contents:
      - articles/screening-rules
      - articles/mixture-screening
      - articles/aggregation
  - title: Checking your pipeline
    navbar: Checking your pipeline
    contents:
      - articles/ground-truth
      - articles/comparing-rules
  - title: Ecosystem
    navbar: Ecosystem
    contents:
      - articles/rtprep-and-bmm
