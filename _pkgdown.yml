url: https://www.gfrischkorn.org/rtprep/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#0072B2" # the first colour of the manuscript's eam_palette

development:
  mode: auto

navbar:
  structure:
    left: [intro, reference, articles, news] # `news` is the NEWS.md component
    right: [search, github]

reference:
  - title: About rtprep
    contents:
      - rtprep-package
  - title: Screening
    desc: One engine, one return shape, whichever rule is applied.
    contents:
      - rt_screen
      - rt_keep
      - screen_fits
      - rules
  - title: Aggregation and estimation
    desc: From surviving trials to EZ-diffusion inputs and parameters.
    contents:
      - rt_summary
      - adjust_accuracy
      - ez_ddm
  - title: Comparison and diagnostics
    desc: >
      What a different choice would have removed, and whether the removed
      trials were what you thought.
    contents:
      - screen_compare
      - check_guessing
  - title: Ground truth
    desc: >
      Generate data with contaminants of known type, so a pipeline can be
      tested instead of trusted.
    contents:
      - r_contaminated
  - title: Data
    contents:
      - has_keyword("datasets")

# No `articles:` section yet. The only vignette, rtprep.Rmd, is the package's
# get-started article and pkgdown puts it in the navbar's `intro` slot; listing
# it here as well left the Articles dropdown with a heading and no links.
# Add the section back when the first non-intro article lands.
